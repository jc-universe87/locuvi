[project]
name = "locuvi"
version = "1.0.0"
description = "Locuvi — personal GP locum invoicing (v0.1)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "httpx>=0.28",
    "reportlab>=4.2",
    "cryptography>=43",
    "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pypdf>=5.1",
    "wsgidav>=4.3",
    "cheroot>=10",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
