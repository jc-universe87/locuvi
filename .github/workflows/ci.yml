# Checks every pull request and every push to main (the stable branch).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests (fictional data, disposable WebDAV, fake AI only)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  # The phone app (Android, and iPhone/iPad from the Home Screen): the whole backend running in
  # the browser with Pyodide. Built from this commit and tested with the full UI smoke test.
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pocket/pyodide
          key: pyodide-${{ hashFiles('frontend/pocket/deps.py') }}
      - name: Gather Pyodide and Locuvi's packages
        run: python frontend/pocket/deps.py "$RUNNER_TEMP/pocket"
      - name: Build the phone app
        working-directory: frontend
        run: |
          npm ci
          PYODIDE_DIR="$RUNNER_TEMP/pocket/pyodide" POCKET_WHEELS="$RUNNER_TEMP/pocket/wheels" npm run build:pocket
      - name: Install the test browser
        run: npm i -g playwright@1.56.1 && npx -y playwright@1.56.1 install --with-deps chromium
      - name: Test it as a phone would run it (plain files, no server)
        run: |
          (cd frontend/dist-pocket && python -m http.server 8790 --bind 127.0.0.1 > /dev/null 2>&1 &)
          sleep 1
          export NODE_PATH=$(npm root -g) BASE_URL=http://127.0.0.1:8790
          POCKET=1 SHOTS="$RUNNER_TEMP/shots" node e2e/smoke.mjs
          node e2e/pocket-keeps.mjs
      - name: Keep test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-test
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-pocket

  # The iPhone and iPad app: the tested phone build, published at
  # https://locuvi.pistio.co.uk/ (open in Safari, then Add to Home Screen).
  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, phone]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      # Docker Hub can be slow, rate-limited (429) or down for shared runners. Everything the
      # build needs from it is fetched first: Google's mirror, then Docker Hub, with retries.
      - name: Fetch base images
        run: ./.github/pull-retry.sh node:22.12.0-bookworm-slim python:3.12.8-slim-bookworm
      - name: Build image
        run: docker build -t locuvi:ci .

  # Every green push to main publishes the image the server pulls:
  #   docker compose pull && docker compose up -d
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # As in the docker job: helper images are fetched first (mirror, then Docker Hub, with
      # retries); buildx uses the local BuildKit image if its own pull fails, and BuildKit
      # pulls the base images through the mirror, falling back to Docker Hub.
      - name: Fetch BuildKit and QEMU images
        run: ./.github/pull-retry.sh moby/buildkit:buildx-stable-1 tonistiigi/binfmt:latest
      - name: Set up QEMU (arm64)
        run: docker run --rm --privileged tonistiigi/binfmt:latest --install arm64
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # fixed name: servers pull this image, whatever the repository is called
          images: ghcr.io/jc-universe87/gp-locum-manager
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
